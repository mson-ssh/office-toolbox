name: officebox

services:
  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DATA_DIR: /data
      JOB_RETENTION_MINUTES: ${JOB_RETENTION_MINUTES:-60}
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-10}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      MAX_FILES_PER_JOB: ${MAX_FILES_PER_JOB:-20}
      MAX_LIGHT_JOBS: ${MAX_LIGHT_JOBS:-2}
      MAX_HEAVY_JOBS: ${MAX_HEAVY_JOBS:-1}
      MAX_QUEUE_SIZE: ${MAX_QUEUE_SIZE:-100}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-200}
      MAX_TOTAL_PIXELS: ${MAX_TOTAL_PIXELS:-250000000}
      MAX_OUTPUT_SIZE_MB: ${MAX_OUTPUT_SIZE_MB:-500}
      MIN_FREE_SPACE_MB: ${MIN_FREE_SPACE_MB:-512}
      PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-600}
      STIRLING_URL: ${STIRLING_URL:-http://stirling:8080}
      STIRLING_API_KEY: ${STIRLING_API_KEY:-}
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp:size=128m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    depends_on:
      stirling:
        condition: service_healthy

  stirling:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:2.14.3-fat@sha256:444c2a995e5266e585cbc22d9613d5b4c11c8ea6ac486a9a05869b55d1775f6a
    restart: unless-stopped
    environment:
      DISABLE_ADDITIONAL_FEATURES: "false"
      SECURITY_ENABLELOGIN: "false"
      SYSTEM_DEFAULTLOCALE: vi-VN
      SYSTEM_MAXFILESIZE: ${MAX_UPLOAD_SIZE_MB:-100}
      METRICS_ENABLED: "false"
      SYSTEM_GOOGLEVISIBILITY: "false"
      SHOW_SURVEY: "false"
    volumes:
      - stirling-config:/configs
      - stirling-logs:/logs
      - stirling-data:/usr/share/tessdata
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/info/status | grep -q 'UP'"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12
    networks:
      - internal

  frontend:
    build:
      context: ./apps/frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-1280}:8080"
    tmpfs:
      - /tmp:size=16m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  stirling-config:
  stirling-logs:
  stirling-data:
